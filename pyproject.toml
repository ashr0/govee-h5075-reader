[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "govee-h5075-reader"
version = "0.1.0"
description = "Read temperature, humidity, and battery data from Govee H5075 Bluetooth sensors"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "ashr0" },
]
dependencies = [
    "bleak>=1.1",
]

[project.urls]
Repository = "https://github.com/ashr0/govee-h5075-reader"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
govee-h5075 = "govee_h5075.cli:main"

[tool.pytest.ini_options]
addopts = "--cov=govee_h5075 --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.hatch.build.targets.wheel]
packages = ["src/govee_h5075"]
